# Прод-развёртывание: PostgreSQL + Redis + backend + frontend (nginx).
# Запуск из каталога deploy/:
#   docker compose -f docker-compose.prod.yml up -d --build
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    restart: unless-stopped

  backend:
    build: ../backend
    env_file: .env
    environment:
      LOCAL_STORAGE_PATH: /app/localdata
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backend_files:/app/localdata
    restart: unless-stopped

  frontend:
    build: ../frontend
    depends_on:
      - backend
    ports:
      - "${HTTP_PORT:-80}:80"
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  backend_files:
